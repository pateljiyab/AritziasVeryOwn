name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (SQLAlchemy 2.1 needs 3.11+) and the version used locally.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest backend/tests

      # The tests import these modules; this runs the scripts the way the README does, so a
      # broken entry point fails CI. No tags, embeddings, or torch: --no-clip skips CLIP.
      - name: Smoke-test the scripts
        run: |
          python backend/src/stylist/jobs/ingest.py
          python backend/src/stylist/cli.py --demo --no-clip
          python backend/src/stylist/jobs/names_report.py
