name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (SQLAlchemy 2.1 needs 3.11+) and the version used locally.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest backend/tests

      # The tests import these modules; this runs the scripts the way the README does, so a
      # broken entry point fails CI. No torch: the tags come from the committed snapshots, and
      # --no-clip skips CLIP query embeddings.
      - name: Smoke-test the scripts
        run: |
          python backend/src/stylist/jobs/ingest.py
          python backend/src/stylist/jobs/restore_tags.py
          python backend/src/stylist/jobs/llm_tag.py
          python backend/src/stylist/cli.py --demo --no-clip
          python backend/src/stylist/jobs/names_report.py
          python backend/src/stylist/jobs/parser_report.py --keyword-only

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # tsc type-checks the client against the API types, then Vite builds it.
      - name: Type-check and build
        run: npm run build
