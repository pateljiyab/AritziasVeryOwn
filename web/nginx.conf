# Serves the built client and forwards the API, so the browser sees one origin (no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Shared by the API routes and the OpenAPI docs.
    proxy_set_header Host $host;
    # Overwrite, not append: the API's per-IP chat limit trusts this header, so a client
    # can't send its own to dodge the limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
    }

    # Built files are fingerprinted, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
