# Serves the built client and forwards the API, so the browser sees one origin (no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Shared by the API routes and the OpenAPI docs.
    proxy_set_header Host $host;
    # The API's per-IP chat limit reads this (STYLIST_CLIENT_IP_HEADER=x-real-ip). nginx sets it
    # from the connection, replacing anything the client sent, so it can't be forged.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
    }

    # Built files are fingerprinted, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
